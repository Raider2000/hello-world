<g id="SCHRIFTFELD" font-size="2.6" fill="#000"><text x="35.0" y="266.0" font-weight="bold">KFS31 · Spitzboden · M 1:100</text>
<text x="35.0" y="270.0" font-size="2">Quelle: 19990111-Grundrisse-Karl_Ferlemann_Str_31.pdf S. 12/13 (Grundriss Spitzboden -Gesamt-, M 1:100) · S. 18 (Schnitt A-A) (1999-01-11 (Plan 01.07.96 / 21.12.98)) · Maße in m · Neuzeichnung, ohne Gewähr – rot nummerierte Punkte sind ungeprüft (Legende)</text>
</g>
<g id="LEGENDE_UNGEPRUEFT" font-size="1.8" fill="#333"><text x="35.0" y="276.2" font-weight="bold" fill="#d00000">Ungeprüfte bzw. angenommene Werte</text>
<text x="35.0" y="279.1">1 Lage der Spitzbodenstreifen in y (3,97–6,81) aus dem entzerrten Scan abgegriffen (±5 cm); bemaßt ist nur die Breite 2,84 (lichte Höhe ≥ 1 m). Die Fläche 34,51 = 12,15 × 2,84 bestätigt Länge und Breite.</text>
<text x="35.0" y="281.8">2 Spitzboden Altbau Süd: Länge nicht bemaßt, Ostgrenze = Trennwand (x 21,23) abgegriffen; Fläche lt. Plan 23,10 m² stimmt mit der Zeichnung auf 0,4 % überein.</text>
<text x="35.0" y="284.5">3 Spitzboden Ost: x 19,44–22,94 abgegriffen (Breite 3,50 bemaßt), Südgrenze y 4,00 abgegriffen, Nordgrenze an der Brandwand y 14,05 angenommen.</text>
<text x="35.0" y="287.2">4 Trennwand zwischen den Altbau-Spitzböden: Beschriftung „…KA F90“ schlecht lesbar (F 90 oder F 30); Stärke 0,10 und Lage abgegriffen. Südlich der 1-m-Linie und nach Nordwesten bis zur Hoffassade im Plan nur gestrichelt (dünn dargestellt).</text>
<text x="35.0" y="289.9">5 Zuordnung W7/W8: Kennzeichen im Süd-Spitzboden als „8“ gelesen, im Ost-Spitzboden unleserlich. Im DG-Plan 1999 (S. 10) liegt W8 im Südwestteil des Altbaus, W7 umfasste Nord- und Ostteil. Der Aufteilungsplan 2010 nummeriert W7 = Süd, W8 = Nord; ob die Sondernutzungsrechte durch die Nachträge 2010/2011 angepasst wurden, ist offen.</text>
<text x="35.0" y="292.6">6 W11: Teilungserklärung 1999 Nr. 1.2.11 nennt den über eine Bodentreppe erreichbaren Spitzboden „dazugehörend … ebenfalls mit W 11 bezeichnet“, anders als bei W7/W8 nicht ausdrücklich als Sondernutzungsrecht.</text>
<text x="35.0" y="295.3">7 Bodentreppen nicht bemaßt; Lage und Größe abgegriffen (ca. 1,41 × 0,72 / 1,28 × 0,73 / 0,72 × 1,42 m).</text>
<text x="35.0" y="298.0">8 Brandwand/Giebel an der Fuge: Stärken lt. Maßkette (0,24 / 0,02 / 0,45); im Plan geschwärzt (über Dach) y 2,98–7,84, Umriss bis Traufe. Länge wie DG angenommen. Kamine sind im Plan nicht erkennbar.</text>
<text x="35.0" y="300.7">9 Außenkontur aus DG.json übernommen; der Spitzbodenplan zeigt Traufen mit Überstand (Süd ca. y −0,46, Ost ca. x 27,4). Dachgauben (Süd- und Ostseite) und Dachflächen sind nicht bemaßt und deshalb nicht gezeichnet.</text>
</g>
</svg>